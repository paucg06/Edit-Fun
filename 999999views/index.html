<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.replace(/\.html$/, '');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>999,999 Views</title>
  <link rel="icon" href="../assets/png/999views_icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@400;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body class="light-theme">

  <!-- Botón 3 Puntos Arriba a la Derecha -->
  <button class="top-menu-btn" id="menu-btn" title="Configurar subida">
    <svg viewBox="0 0 24 24">
      <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
  </button>

  <!-- Panel de Configuración Compacto -->
  <div class="config-modal" id="config-modal">
    <div class="modal-header">
      <span>Configuración de subida</span>
    </div>

    <!-- Views -->
    <div class="config-row">
      <div class="config-label-row">
        <div class="config-label-with-icon">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <span>Views</span>
          <span class="modified-dot" id="dot-views"></span>
        </div>
      </div>
      <div class="config-inputs-pair">
        <input type="number" id="input-views-start" class="config-input" value="20000" placeholder="Inicial">
        <input type="number" id="input-views-end" class="config-input" value="1000000" placeholder="Final">
      </div>
    </div>

    <!-- Likes -->
    <div class="config-row">
      <div class="config-label-row">
        <div class="config-label-with-icon">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          <span>Likes</span>
          <span class="modified-dot" id="dot-likes"></span>
        </div>
      </div>
      <div class="config-inputs-pair">
        <input type="number" id="input-likes-start" class="config-input" value="900" placeholder="Inicial">
        <input type="number" id="input-likes-end" class="config-input" value="45000" placeholder="Final">
      </div>
    </div>

    <!-- Dislikes -->
    <div class="config-row">
      <div class="config-label-row">
        <div class="config-label-with-icon">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
          <span>Dislikes</span>
          <span class="modified-dot" id="dot-dislikes"></span>
        </div>
      </div>
      <div class="config-inputs-pair">
        <input type="number" id="input-dislikes-start" class="config-input" value="3" placeholder="Inicial">
        <input type="number" id="input-dislikes-end" class="config-input" value="120" placeholder="Final">
      </div>
    </div>

    <!-- Duración y Formato -->
    <div class="config-row">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span>Duración y Formato</span>
      </div>
      <div class="config-inputs-pair">
        <input type="number" id="input-duration" class="config-input" value="10" placeholder="Segundos" min="1">
        <select id="select-label" class="config-input">
          <option value="Views">Views</option>
          <option value="visualizaciones">visualizaciones</option>
        </select>
      </div>
    </div>

    <!-- SECCIÓN DE LÍNEA DE VELOCIDAD HORIZONTAL CON 3 PUNTOS Y BOTÓN RESET -->
    <div class="curve-section">
      <div class="curve-header">
        <span>Línea de Ritmo (Velocidad)</span>
        <button class="curve-reset-btn" id="btn-reset-curve" title="Restablecer a velocidad constante (línea horizontal)">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>

      <!-- Selector de Métrica (Tipo Menú Móvil) -->
      <div class="metric-tabs-bar">
        <button class="metric-tab active" data-metric="views" id="tab-btn-views" title="Configurar velocidad de Views">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <span class="metric-tab-text">Views</span>
        </button>
        <button class="metric-tab" data-metric="likes" id="tab-btn-likes" title="Configurar velocidad de Likes">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          <span class="metric-tab-text">Likes</span>
        </button>
        <button class="metric-tab" data-metric="dislikes" id="tab-btn-dislikes" title="Configurar velocidad de Dislikes">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
          <span class="metric-tab-text">Dislikes</span>
        </button>
      </div>
      
      <!-- Gráfica SVG Línea de Velocidad Horizontal -->
      <div class="curve-canvas-wrapper" id="curve-canvas-wrapper" title="Sube los puntos para acelerar o bájalos para frenar la velocidad en ese tramo">
        <svg class="curve-svg" id="curve-svg-elem" viewBox="0 0 280 80">
          <!-- Línea de referencia horizontal constante en el centro (1x) -->
          <line class="speed-reference-line" x1="0" y1="40" x2="280" y2="40"/>
          <line x1="70" y1="0" x2="70" y2="80" stroke="currentColor" opacity="0.04" stroke-dasharray="2,2"/>
          <line x1="140" y1="0" x2="140" y2="80" stroke="currentColor" opacity="0.04" stroke-dasharray="2,2"/>
          <line x1="210" y1="0" x2="210" y2="80" stroke="currentColor" opacity="0.04" stroke-dasharray="2,2"/>
          
          <!-- Línea guía continua -->
          <polyline id="curve-guide-poly" points="0,40 70,40 140,40 210,40 280,40" fill="none" stroke="#ff0000" opacity="0.18" stroke-dasharray="3,3"/>

          <!-- Trayectoria de la velocidad -->
          <path id="curve-path" d="M 0 40 L 280 40" fill="none" stroke="#ff0000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- 3 Puntos Clave de Control (P1, P2, P3) -->
          <circle id="cp-1" class="curve-handle" data-point-index="0" cx="70" cy="40" r="5.5" fill="#ff0000" stroke="#ffffff" stroke-width="2"/>
          <circle id="cp-2" class="curve-handle" data-point-index="1" cx="140" cy="40" r="5.5" fill="#ff0000" stroke="#ffffff" stroke-width="2"/>
          <circle id="cp-3" class="curve-handle" data-point-index="2" cx="210" cy="40" r="5.5" fill="#ff0000" stroke="#ffffff" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- Selector de Tema con Iconos SVG -->
    <div class="theme-toggle-row">
      <button class="theme-btn-option active" id="btn-theme-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span>Blanco</span>
      </button>

      <button class="theme-btn-option" id="btn-theme-dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
        </svg>
        <span>Negro</span>
      </button>
    </div>

    <!-- Iniciar -->
    <button class="action-btn-primary" id="btn-apply-start">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Iniciar Subida</span>
    </button>

    <!-- Salir al menú principal con el mismo icono de GoogleFake -->
    <a href="../" class="exit-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Salir al Menú</span>
    </a>
  </div>

  <!-- Contenedor Principal de Estadísticas -->
  <div class="stats-container" id="stats-area" title="Haz clic o pulsa Espacio para pausar/reanudar">
    
    <!-- Views -->
    <div class="views-title-row">
      <span class="views-number" id="display-views">20,000</span>
      <span class="views-label" id="display-label">Views</span>
    </div>

    <!-- Barra de progreso roja -->
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <!-- Likes y Dislikes -->
    <div class="likes-dislikes-row">
      <!-- Likes -->
      <div class="stat-item">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24">
            <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/>
          </svg>
        </div>
        <span id="display-likes">900</span>
      </div>

      <!-- Dislikes -->
      <div class="stat-item">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24">
            <path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/>
          </svg>
        </div>
        <span id="display-dislikes">3</span>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
