<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.replace(/\.html$/, '');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Up</title>
  <link rel="icon" href="../assets/png/time_up_icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>
<body class="dark-theme">

  <!-- Botón 3 Puntos Arriba a la Derecha -->
  <button class="top-menu-btn" id="menu-btn" title="Configurar">
    <svg viewBox="0 0 24 24">
      <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
  </button>

  <!-- Display 7 Segmentos Sólido -->
  <div class="display-wrapper" id="display-area" title="Haz clic para Iniciar / Parar">
    <div class="segment-dim-bg">88:88:88</div>
    <div class="segment-active-digits" id="display-time">04:00:00</div>
  </div>

  <!-- Botones Principales: Parar / Iniciar (Izquierda) y Reiniciar (Derecha) -->
  <div class="main-controls-row">
    <button class="btn-main-action btn-main-toggle" id="btn-toggle">
      Parar
    </button>
    <button class="btn-main-action btn-main-reset" id="btn-reset">
      Reiniciar
    </button>
  </div>

  <!-- Panel de Configuración Compacto -->
  <div class="config-modal" id="config-modal">
    <div class="modal-header">
      <span>Configuración</span>
    </div>

    <!-- 1. MODO (Cuenta atrás / Cronómetro) -->
    <div class="config-row">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <span>Modo</span>
      </div>
      <div class="toggle-row">
        <button class="toggle-btn-option active" id="btn-mode-countdown">
          Cuenta atrás
        </button>
        <button class="toggle-btn-option" id="btn-mode-countup">
          Cronómetro
        </button>
      </div>
    </div>

    <!-- 2. TIEMPO (Solo visible en Cuenta atrás) -->
    <div class="config-row" id="row-time-config">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <span>Tiempo</span>
      </div>
      <div class="config-inputs-grid">
        <input type="number" id="input-h" class="config-input" value="04" min="0" max="99" placeholder="00">
        <input type="number" id="input-m" class="config-input" value="00" min="0" max="59" placeholder="00">
        <input type="number" id="input-s" class="config-input" value="00" min="0" max="59" placeholder="00">
      </div>
    </div>

    <!-- 3. VELOCIDAD (Solo 3 opciones: Normal, Personalizada, Timelapse) -->
    <div class="config-row">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.28-10.43zM10.59 15.41a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
        <span>Velocidad</span>
      </div>
      <select id="select-speed" class="config-input">
        <option value="normal" id="opt-speed-normal">Normal</option>
        <option value="custom" id="opt-speed-custom">Personalizada</option>
        <option value="timelapse" id="opt-speed-timelapse">Timelapse</option>
      </select>
    </div>

    <!-- Input extra de velocidad personalizada -->
    <div class="config-row" id="row-custom-speed" style="display: none;">
      <div class="config-label-with-icon">
        <span>Multiplicador</span>
      </div>
      <input type="number" id="input-custom-speed" class="config-input" value="2" min="1" max="100000" placeholder="2">
    </div>

    <!-- Panel de Timelapse: Duración y Curva con 3 puntos -->
    <div class="config-row" id="row-timelapse-config" style="display: none;">
      <div class="config-label-with-icon">
        <span>Duración (segundos)</span>
      </div>
      <input type="number" id="input-timelapse-secs" class="config-input" value="5" min="1" max="300" placeholder="5">

      <!-- Curva interactiva de ritmo -->
      <div class="curve-section">
        <div class="curve-header">
          <span>Curva de Ritmo</span>
          <button class="curve-reset-btn" id="btn-reset-curve" title="Restablecer a velocidad constante">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
        </div>

        <div class="curve-canvas-wrapper" id="curve-canvas-wrapper" title="Arrastra los puntos para modular la aceleración">
          <svg class="curve-svg" id="curve-svg-elem" viewBox="0 0 280 72">
            <line class="speed-reference-line" x1="0" y1="36" x2="280" y2="36"/>
            <line x1="70" y1="0" x2="70" y2="72" stroke="currentColor" opacity="0.05" stroke-dasharray="2,2"/>
            <line x1="140" y1="0" x2="140" y2="72" stroke="currentColor" opacity="0.05" stroke-dasharray="2,2"/>
            <line x1="210" y1="0" x2="210" y2="72" stroke="currentColor" opacity="0.05" stroke-dasharray="2,2"/>
            
            <path id="curve-path" d="M 0 36 L 280 36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

            <circle id="cp-1" class="curve-handle" data-point-index="0" cx="70" cy="36" r="5.5" fill="currentColor" stroke="var(--panel-bg)" stroke-width="2"/>
            <circle id="cp-2" class="curve-handle" data-point-index="1" cx="140" cy="36" r="5.5" fill="currentColor" stroke="var(--panel-bg)" stroke-width="2"/>
            <circle id="cp-3" class="curve-handle" data-point-index="2" cx="210" cy="36" r="5.5" fill="currentColor" stroke="var(--panel-bg)" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 4. SONIDO AL FINALIZAR (Solo en Cuenta atrás) -->
    <div class="config-row" id="row-sound-config">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span>Sonido</span>
      </div>
      <select id="select-sound" class="config-input">
        <option value="beep">Pitido Digital (Casio)</option>
        <option value="bell">Campana</option>
        <option value="double">Alarma Doble</option>
        <option value="none">Silencio</option>
      </select>
    </div>

    <!-- 5. COLOR DE DÍGITOS (Por defecto / Naranja) -->
    <div class="config-row">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <span>Color</span>
      </div>
      <div class="toggle-row">
        <button class="toggle-btn-option active" id="btn-color-default">
          Por defecto
        </button>
        <button class="toggle-btn-option" id="btn-color-orange">
          Naranja
        </button>
      </div>
    </div>

    <!-- 6. SELECTOR DE TEMA CON ICONO DE CONTRASTE -->
    <div class="config-row">
      <div class="config-label-with-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm1-17.93c3.94.49 7 3.85 7 7.93s-3.06 7.44-7 7.93V4.07z"/></svg>
        <span>Tema</span>
      </div>
      <div class="toggle-row">
        <button class="toggle-btn-option" id="btn-theme-light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span>Blanco</span>
        </button>

        <button class="toggle-btn-option active" id="btn-theme-dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          </svg>
          <span>Negro</span>
        </button>
      </div>
    </div>

    <!-- 7. SALIR AL MENÚ PRINCIPAL -->
    <a href="../" class="exit-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Salir al Menú</span>
    </a>
  </div>

  <script src="script.js"></script>

</body>
</html>
