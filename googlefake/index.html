<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function() {
      let p = window.location.pathname;
      if (p.endsWith('.html')) p = p.replace(/\.html$/, '');
      if (p.endsWith('/') && p !== '/') p = p.slice(0, -1);
      if (p !== window.location.pathname) {
        window.history.replaceState(null, '', p + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- Barra de progreso superior -->
  <div id="top-loader">
    <div class="bar"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="nav-group">
      <span class="nav-plain-text">Sobre Google</span>
      <span class="nav-plain-text">Tienda</span>
    </div>
    <div class="nav-group">
      <span class="nav-plain-text">Gmail</span>
      <span class="nav-plain-text">Imágenes</span>
      
      <!-- Botón 9 Puntos que abre el panel desplegable -->
      <button class="apps-icon-btn" id="apps-menu-btn" title="Opciones">
        <!-- 3x3 Grid Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>

      <!-- Panel Desplegable Compacto -->
      <div class="apps-popover" id="apps-popover">
        <!-- Alternar Modo Claro / Oscuro con iconos SVG de Sol / Nube -->
        <button class="popover-item" id="popover-theme-toggle">
          <!-- Icono Sol SVG (Modo Claro) -->
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Icono Nube SVG (Modo Oscuro) -->
          <svg id="theme-icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          </svg>
          <span id="popover-theme-label">Modo Claro</span>
        </button>

        <div class="popover-divider"></div>

        <!-- Salir al menú principal -->
        <a href="../" class="popover-item">
          <!-- Icono Salir / Volver SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Salir al Menú</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Area -->
  <main>
    <div class="logo-container">
      <!-- Versión Modo Oscuro (Blanco) -->
      <div class="logo-dark">Google</div>
      
      <!-- Versión Modo Claro (Multicolor Oficial Google) -->
      <div class="logo-light">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>
    </div>

    <div class="search-box-container">
      <div class="search-box" id="search-box">
        <button class="search-icon-btn" id="btn-search-icon" title="Buscar">
          <!-- Magnifying Glass Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>

        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          autofocus
        />

        <div class="search-tools-right">
          <!-- Micrófono oficial Google Material Symbols -->
          <div class="tool-btn" title="Buscar por voz">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M480-400q-50 0-85-35t-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35Zm-40 280v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Z"/>
            </svg>
          </div>

          <!-- Cámara Lens oficial Google Material Symbols -->
          <div class="tool-btn" title="Buscar por imagen">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M480-320q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35Zm240 160q-33 0-56.5-23.5T640-240q0-33 23.5-56.5T720-320q33 0 56.5 23.5T800-240q0 33-23.5 56.5T720-160Zm-440 40q-66 0-113-47t-47-113v-80h80v80q0 33 23.5 56.5T280-200h200v80H280Zm480-320v-160q0-33-23.5-56.5T680-680H280q-33 0-56.5 23.5T200-600v120h-80v-120q0-66 47-113t113-47h80l40-80h160l40 80h80q66 0 113 47t47 113v160h-80Z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Botones: Buscar con Google y Suscribirse -->
    <div class="buttons-container">
      <button class="google-btn" id="btn-search">Buscar con Google</button>
      <button class="google-btn" id="btn-subscribe">Suscribirse</button>
    </div>

    <!-- Idiomas -->
    <div class="languages-container">
      Ofrecido por Google en: <span class="lang-word">castellano</span>
    </div>
  </main>

  <div></div>

  <!-- Pantalla de carga oficial de Google (Solo spinner circular) -->
  <div id="loading-overlay">
    <svg class="google-spinner" viewBox="25 25 50 50">
      <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-miterlimit="10"/>
    </svg>
  </div>

  <script src="script.js"></script>

</body>
</html>
