<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.replace(/\.html$/, '');
      window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #202124;
      --text-color: #e8eaed;
      --header-text-color: #e8eaed;
      --search-bg: #303134;
      --search-border: #5f6368;
      --search-hover-bg: #303134;
      --search-shadow: rgba(0, 0, 0, 0.3);
      --search-icon-color: #9aa0a6;
      --btn-bg: #303134;
      --btn-border: #303134;
      --btn-text: #e8eaed;
      --btn-hover-border: #5f6368;
      --btn-hover-bg: #3c4043;
      --lang-color: #bdc1c6;
      --lang-link: #8ab4f8;
      --top-loader-bg: #8ab4f8;
      --apps-hover: rgba(232, 234, 237, 0.08);
      --popover-bg: #303134;
      --popover-border: #5f6368;
      --popover-hover: rgba(255, 255, 255, 0.08);
      --popover-shadow: rgba(0, 0, 0, 0.35);
    }

    body.light-theme {
      --bg-color: #ffffff;
      --text-color: #202124;
      --header-text-color: #1f1f1f;
      --search-bg: #ffffff;
      --search-border: #dfe1e5;
      --search-hover-bg: #ffffff;
      --search-shadow: rgba(32, 33, 36, 0.28);
      --search-icon-color: #9aa0a6;
      --btn-bg: #f1f3f4;
      --btn-border: #f1f3f4;
      --btn-text: #3c4043;
      --btn-hover-border: #dadce0;
      --btn-hover-bg: #e8eaed;
      --lang-color: #4d5156;
      --lang-link: #1a0dab;
      --top-loader-bg: #4285f4;
      --apps-hover: rgba(60, 64, 67, 0.08);
      --popover-bg: #ffffff;
      --popover-border: #dfe1e5;
      --popover-hover: #f1f3f4;
      --popover-shadow: rgba(0, 0, 0, 0.15);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      overflow-x: hidden;
      position: relative;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Barra de progreso superior al buscar */
    #top-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      overflow: hidden;
      z-index: 9999;
      display: none;
    }

    #top-loader .bar {
      position: absolute;
      background-color: var(--top-loader-bg);
      height: 100%;
      animation: indeterminate 1.6s infinite ease-in-out;
    }

    @keyframes indeterminate {
      0% {
        left: -35%;
        right: 100%;
      }
      60% {
        left: 100%;
        right: -90%;
      }
      100% {
        left: 100%;
        right: -90%;
      }
    }

    /* Header alineado a nivel de píxel */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      font-size: 13px;
      position: relative;
      min-height: 56px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 40px;
    }

    /* Textos estáticos superiores con alineación exacta */
    .nav-plain-text {
      color: var(--header-text-color);
      font-size: 13px;
      cursor: default;
      user-select: none;
      text-decoration: none;
      opacity: 0.88;
      display: inline-flex;
      align-items: center;
      height: 100%;
      line-height: 1;
    }

    .nav-plain-text:hover {
      text-decoration: none !important;
      opacity: 0.88;
    }

    /* Botón 9 puntos */
    .apps-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--header-text-color);
      background: transparent;
      border: none;
      transition: background-color 0.15s;
    }

    .apps-icon-btn:hover {
      background-color: var(--apps-hover);
    }

    .apps-icon-btn svg {
      fill: var(--header-text-color);
      width: 20px;
      height: 20px;
    }

    /* Pequeño panel desplegable tipo Google */
    .apps-popover {
      position: absolute;
      top: 56px;
      right: 20px;
      background: var(--popover-bg);
      border: 1px solid var(--popover-border);
      border-radius: 16px;
      box-shadow: 0 4px 18px var(--popover-shadow);
      padding: 6px;
      display: none;
      flex-direction: column;
      min-width: 170px;
      z-index: 1000;
      animation: fadeIn 0.12s ease-out;
    }

    .apps-popover.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .popover-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      color: var(--text-color);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      font-family: 'Google Sans', Roboto, sans-serif;
      transition: background-color 0.12s;
    }

    .popover-item:hover {
      background-color: var(--popover-hover);
    }

    .popover-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: var(--text-color);
    }

    .popover-divider {
      height: 1px;
      background: var(--popover-border);
      margin: 4px 6px;
    }

    /* Main Container (centrado y elevado) */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      margin-top: -85px;
    }

    /* Logo Google (Dinámico: Blanco en Dark, Multicolor en Light) */
    .logo-container {
      margin-bottom: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-dark {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 92px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1;
      display: block;
    }

    .logo-light {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 92px;
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 1;
      display: none;
    }

    body.light-theme .logo-dark {
      display: none;
    }
    body.light-theme .logo-light {
      display: block;
    }

    .g-blue { color: #4285f4; }
    .g-red { color: #ea4335; }
    .g-yellow { color: #fbbc05; }
    .g-green { color: #34a853; }

    /* Barra de búsqueda */
    .search-box-container {
      width: 100%;
      max-width: 692px;
      position: relative;
    }

    .search-box {
      width: 100%;
      height: 48px;
      background-color: var(--search-bg);
      border: 1px solid var(--search-border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      transition: background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .search-box:hover, .search-box:focus-within {
      background-color: var(--search-hover-bg);
      box-shadow: 0 1px 6px var(--search-shadow);
      border-color: var(--search-border);
    }

    body.light-theme .search-box:hover, 
    body.light-theme .search-box:focus-within {
      border-color: transparent;
    }

    /* Icono lupa de búsqueda izquierda */
    .search-icon-btn {
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--search-icon-color);
      margin-right: 12px;
      cursor: pointer;
      padding: 2px;
    }

    .search-icon-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--search-icon-color);
      transition: fill 0.2s;
    }

    .search-box:hover .search-icon-btn svg,
    .search-box:focus-within .search-icon-btn svg {
      fill: var(--text-color);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-size: 16px;
      font-family: inherit;
      height: 100%;
      user-select: text;
    }

    .search-input::placeholder {
      color: transparent;
    }

    /* Contenedor de iconos derecha (Micrófono y Lens) */
    .search-tools-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 10px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      color: var(--text-color);
      transition: opacity 0.15s;
    }

    .tool-btn:hover {
      opacity: 0.8;
    }

    .tool-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Botones de acción */
    .buttons-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .google-btn {
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      font-family: inherit;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.1s, background-color 0.1s, box-shadow 0.1s;
    }

    .google-btn:hover {
      border: 1px solid var(--btn-hover-border);
      background-color: var(--btn-hover-bg);
    }

    body.light-theme .google-btn:hover {
      box-shadow: 0 1px 1px rgba(0,0,0,0.1);
      color: #202124;
    }

    /* Texto idioma */
    .languages-container {
      margin-top: 28px;
      font-size: 13px;
      color: var(--lang-color);
      text-align: center;
    }

    .languages-container .lang-word {
      color: var(--lang-link);
      margin-left: 4px;
      cursor: default;
    }

    /* Pantalla de carga oficial de Google (Solo spinner circular) */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
      cursor: pointer;
    }

    #loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .google-spinner {
      animation: rotate-spinner 2s linear infinite;
      height: 52px;
      width: 52px;
      transform-origin: center center;
    }

    .google-spinner .path {
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      stroke-width: 4;
      animation: dash-spinner 1.5s ease-in-out infinite, color-spinner 6s ease-in-out infinite;
    }

    @keyframes rotate-spinner {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes dash-spinner {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35px;
      }
      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124px;
      }
    }

    @keyframes color-spinner {
      100%, 0% {
        stroke: #4285f4;
      }
      40% {
        stroke: #ea4335;
      }
      66% {
        stroke: #fbbc05;
      }
      80%, 90% {
        stroke: #34a853;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de progreso superior -->
  <div id="top-loader">
    <div class="bar"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="nav-group">
      <span class="nav-plain-text">Sobre Google</span>
      <span class="nav-plain-text">Tienda</span>
    </div>
    <div class="nav-group">
      <span class="nav-plain-text">Gmail</span>
      <span class="nav-plain-text">Imágenes</span>
      
      <!-- Botón 9 Puntos que abre el panel desplegable -->
      <button class="apps-icon-btn" id="apps-menu-btn" title="Opciones">
        <!-- 3x3 Grid Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
      </button>

      <!-- Panel Desplegable Compacto -->
      <div class="apps-popover" id="apps-popover">
        <!-- Alternar Modo Claro / Oscuro con iconos SVG de Sol / Nube -->
        <button class="popover-item" id="popover-theme-toggle">
          <!-- Icono Sol SVG (Modo Claro) -->
          <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Icono Nube SVG (Modo Oscuro) -->
          <svg id="theme-icon-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
          </svg>
          <span id="popover-theme-label">Modo Claro</span>
        </button>

        <div class="popover-divider"></div>

        <!-- Salir al menú principal -->
        <a href="index.html" class="popover-item">
          <!-- Icono Salir / Volver SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Salir al Menú</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Area -->
  <main>
    <div class="logo-container">
      <!-- Versión Modo Oscuro (Blanco) -->
      <div class="logo-dark">Google</div>
      
      <!-- Versión Modo Claro (Multicolor Oficial Google) -->
      <div class="logo-light">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>
    </div>

    <div class="search-box-container">
      <div class="search-box" id="search-box">
        <button class="search-icon-btn" id="btn-search-icon" title="Buscar">
          <!-- Magnifying Glass Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>

        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="off" 
          spellcheck="false"
          autofocus
        />

        <div class="search-tools-right">
          <!-- Micrófono oficial Google Material Symbols -->
          <div class="tool-btn" title="Buscar por voz">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M480-400q-50 0-85-35t-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35Zm-40 280v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Z"/>
            </svg>
          </div>

          <!-- Cámara Lens oficial Google Material Symbols -->
          <div class="tool-btn" title="Buscar por imagen">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path d="M480-320q-50 0-85-35t-35-85q0-50 35-85t85-35q50 0 85 35t35 85q0 50-35 85t-85 35Zm240 160q-33 0-56.5-23.5T640-240q0-33 23.5-56.5T720-320q33 0 56.5 23.5T800-240q0 33-23.5 56.5T720-160Zm-440 40q-66 0-113-47t-47-113v-80h80v80q0 33 23.5 56.5T280-200h200v80H280Zm480-320v-160q0-33-23.5-56.5T680-680H280q-33 0-56.5 23.5T200-600v120h-80v-120q0-66 47-113t113-47h80l40-80h160l40 80h80q66 0 113 47t47 113v160h-80Z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Botones: Buscar con Google y Suscribirse -->
    <div class="buttons-container">
      <button class="google-btn" id="btn-search">Buscar con Google</button>
      <button class="google-btn" id="btn-subscribe">Suscribirse</button>
    </div>

    <!-- Idiomas -->
    <div class="languages-container">
      Ofrecido por Google en: <span class="lang-word">castellano</span>
    </div>
  </main>

  <div></div>

  <!-- Pantalla de carga oficial de Google (Solo spinner circular) -->
  <div id="loading-overlay">
    <svg class="google-spinner" viewBox="25 25 50 50">
      <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-miterlimit="10"/>
    </svg>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const loadingOverlay = document.getElementById('loading-overlay');
    const topLoader = document.getElementById('top-loader');
    const btnSearchIcon = document.getElementById('btn-search-icon');
    const btnSearch = document.getElementById('btn-search');
    const btnSubscribe = document.getElementById('btn-subscribe');
    
    // Elementos del menú desplegable de los 9 puntos
    const appsMenuBtn = document.getElementById('apps-menu-btn');
    const appsPopover = document.getElementById('apps-popover');
    const popoverThemeToggle = document.getElementById('popover-theme-toggle');
    const themeIconSun = document.getElementById('theme-icon-sun');
    const themeIconCloud = document.getElementById('theme-icon-cloud');
    const popoverThemeLabel = document.getElementById('popover-theme-label');

    // Manejo de Tema Claro / Oscuro
    function applyTheme(isLight) {
      if (isLight) {
        document.body.classList.add('light-theme');
        themeIconSun.style.display = 'none';
        themeIconCloud.style.display = 'block';
        popoverThemeLabel.textContent = 'Modo Oscuro';
        localStorage.setItem('google_theme_mode', 'light');
      } else {
        document.body.classList.remove('light-theme');
        themeIconSun.style.display = 'block';
        themeIconCloud.style.display = 'none';
        popoverThemeLabel.textContent = 'Modo Claro';
        localStorage.setItem('google_theme_mode', 'dark');
      }
    }

    const savedTheme = localStorage.getItem('google_theme_mode');
    if (savedTheme === 'light') {
      applyTheme(true);
    } else {
      applyTheme(false);
    }

    // Toggle Popover
    appsMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      appsPopover.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!appsPopover.contains(e.target) && e.target !== appsMenuBtn) {
        appsPopover.classList.remove('open');
      }
    });

    popoverThemeToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCurrentlyLight = document.body.classList.contains('light-theme');
      applyTheme(!isCurrentlyLight);
      appsPopover.classList.remove('open');
    });

    document.getElementById('search-box').addEventListener('click', (e) => {
      if (e.target !== btnSearchIcon && !btnSearchIcon.contains(e.target)) {
        searchInput.focus();
      }
    });

    function showLoading() {
      topLoader.style.display = 'block';
      loadingOverlay.classList.add('active');
    }

    function hideLoading() {
      loadingOverlay.classList.remove('active');
      topLoader.style.display = 'none';
      searchInput.focus();
    }

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        showLoading();
      }
    });

    btnSearchIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      showLoading();
    });

    btnSearch.addEventListener('click', () => showLoading());
    btnSubscribe.addEventListener('click', () => showLoading());

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        appsPopover.classList.remove('open');
      }
      if (loadingOverlay.classList.contains('active')) {
        if (e.key !== 'Enter') {
          hideLoading();
        }
      }
    });

    loadingOverlay.addEventListener('click', () => {
      hideLoading();
    });
  </script>
</body>
</html>
